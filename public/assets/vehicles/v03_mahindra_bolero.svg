<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="boleroBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="boleroCab" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="boleroTray" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <linearGradient id="boleroTire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="boleroRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#64748B"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#boleroBg)"/>
  <!-- Shadow -->
  <ellipse cx="305" cy="335" rx="265" ry="16" fill="#000000" opacity="0.15"/>
  <ellipse cx="305" cy="333" rx="215" ry="10" fill="#000000" opacity="0.18"/>

  <!-- High-Clearance Chassis & Leaf Springs -->
  <rect x="90" y="275" width="430" height="16" rx="3" fill="#1E293B"/>
  <path d="M 380 270 Q 425 255 470 270" stroke="#475569" stroke-width="6" fill="none"/>
  <rect x="250" y="260" width="75" height="24" rx="4" fill="#334155"/>

  <!-- Long Rear Pickup Cargo Tray (8.2ft Metal Body) -->
  <rect x="250" y="150" width="270" height="115" rx="4" fill="url(#boleroTray)" stroke="#991B1B" stroke-width="2"/>
  <!-- Drop-down side latches & ribs -->
  <line x1="250" y1="205" x2="520" y2="205" stroke="#7F1D1D" stroke-width="3"/>
  <rect x="300" y="198" width="12" height="15" rx="2" fill="#F8FAFC" stroke="#7F1D1D"/>
  <rect x="380" y="198" width="12" height="15" rx="2" fill="#F8FAFC" stroke="#7F1D1D"/>
  <rect x="460" y="198" width="12" height="15" rx="2" fill="#F8FAFC" stroke="#7F1D1D"/>
  <!-- Heavy Duty Tubular Roll Bar Behind Cabin -->
  <path d="M 245 130 L 245 260 M 245 130 L 285 200" stroke="#1E293B" stroke-width="5" stroke-linecap="round"/>

  <!-- Bolero Plaque -->
  <rect x="280" y="160" width="210" height="38" rx="4" fill="#0F172A" opacity="0.9"/>
  <text x="385" y="178" fill="#FFFFFF" font-family="system-ui, sans-serif" font-weight="900" font-size="12" text-anchor="middle" letter-spacing="1">BOLERO MAXI TRUCK PLUS</text>
  <text x="385" y="191" fill="#FCA5A5" font-family="monospace" font-weight="700" font-size="10" text-anchor="middle">1,200 KG PAYLOAD • 8.2 FT TRAY</text>

  <!-- Bolero SUV Cab & Prominent Front Bonnet / Nose -->
  <path d="M 248 140 L 248 265 L 180 265 L 75 265 C 68 265 62 258 62 250 L 62 215 C 62 205 70 198 80 198 L 140 195 L 175 125 C 182 112 195 105 210 105 L 240 105 C 245 105 248 120 248 140 Z" fill="url(#boleroCab)" stroke="#94A3B8" stroke-width="2"/>

  <!-- Bolero Windshield -->
  <path d="M 148 190 L 178 128 C 182 120 192 116 202 116 L 235 116 L 235 185 L 148 190 Z" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <path d="M 155 185 L 182 130 L 220 130 L 155 170 Z" fill="#38BDF8" opacity="0.4"/>
  <!-- Bolero Door Seam & Window -->
  <path d="M 175 192 L 242 190 L 242 260 L 170 260 Z" fill="none" stroke="#64748B" stroke-width="1.5"/>
  <rect x="215" y="208" width="16" height="5" rx="2" fill="#1E293B"/>

  <!-- Bolero Signature Slotted Chrome Grille -->
  <rect x="62" y="205" width="22" height="35" rx="3" fill="#1E293B"/>
  <line x1="66" y1="210" x2="66" y2="235" stroke="#E2E8F0" stroke-width="2.5"/>
  <line x1="72" y1="210" x2="72" y2="235" stroke="#E2E8F0" stroke-width="2.5"/>
  <line x1="78" y1="210" x2="78" y2="235" stroke="#E2E8F0" stroke-width="2.5"/>

  <!-- Square Rugged Halogen Headlights & Turn Signal -->
  <rect x="65" y="210" width="18" height="18" rx="3" fill="#FEF08A" stroke="#CA8A04" stroke-width="2"/>
  <rect x="65" y="232" width="18" height="8" rx="2" fill="#EA580C"/>

  <!-- Metal Front Bumper with Tow Hook -->
  <rect x="52" y="248" width="35" height="20" rx="3" fill="#1E293B"/>
  <circle cx="58" cy="258" r="4" fill="#94A3B8"/>

  <!-- Large High-Stance Rugged Wheels (Front) -->
  <path d="M 95 265 C 95 225 165 225 165 265 Z" fill="#1E293B"/>
  <circle cx="130" cy="295" r="42" fill="url(#boleroTire)"/>
  <circle cx="130" cy="295" r="24" fill="url(#boleroRim)"/>
  <circle cx="130" cy="295" r="9" fill="#1E293B"/>
  <!-- 5-Lug Rims -->
  <circle cx="130" cy="282" r="3" fill="#E2E8F0"/>
  <circle cx="142" cy="291" r="3" fill="#E2E8F0"/>
  <circle cx="137" cy="305" r="3" fill="#E2E8F0"/>
  <circle cx="123" cy="305" r="3" fill="#E2E8F0"/>
  <circle cx="118" cy="291" r="3" fill="#E2E8F0"/>

  <!-- Large High-Stance Rugged Wheels (Rear) -->
  <path d="M 400 265 C 400 225 470 225 470 265 Z" fill="#1E293B"/>
  <circle cx="435" cy="295" r="42" fill="url(#boleroTire)"/>
  <circle cx="435" cy="295" r="24" fill="url(#boleroRim)"/>
  <circle cx="435" cy="295" r="9" fill="#1E293B"/>
  <!-- 5-Lug Rims -->
  <circle cx="435" cy="282" r="3" fill="#E2E8F0"/>
  <circle cx="447" cy="291" r="3" fill="#E2E8F0"/>
  <circle cx="442" cy="305" r="3" fill="#E2E8F0"/>
  <circle cx="428" cy="305" r="3" fill="#E2E8F0"/>
  <circle cx="423" cy="291" r="3" fill="#E2E8F0"/>
  <!-- Heavy Mudflap -->
  <rect x="472" y="280" width="12" height="32" rx="2" fill="#0F172A"/>

  <!-- Rear Tailgate Hinges & Taillights -->
  <rect x="515" y="225" width="8" height="28" rx="2" fill="#DC2626"/>
  <rect x="515" y="255" width="8" height="10" rx="1" fill="#F59E0B"/>

  <!-- Top Badge -->
  <g transform="translate(30, 30)">
    <rect width="140" height="28" rx="6" fill="#0F172A" opacity="0.85"/>
    <circle cx="16" cy="14" r="5" fill="#DC2626"/>
    <text x="28" y="18" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="11">V03 • PICKUP LCV</text>
  </g>
</svg>
