<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="apeBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="apeCab" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="apeBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="apeTire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="apeRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#apeBg)"/>
  <!-- Ground shadow -->
  <ellipse cx="290" cy="325" rx="230" ry="16" fill="#000000" opacity="0.12"/>
  <ellipse cx="290" cy="324" rx="180" ry="10" fill="#000000" opacity="0.15"/>

  <!-- Chassis & Axle -->
  <rect x="140" y="275" width="310" height="14" rx="3" fill="#334155"/>
  <rect x="160" y="260" width="280" height="18" fill="#1E293B"/>

  <!-- Cargo Bay (Rear) -->
  <rect x="230" y="140" width="250" height="130" rx="6" fill="url(#apeBody)" stroke="#075985" stroke-width="2"/>
  <!-- Corrugated Ribs on Cargo Bay -->
  <rect x="245" y="150" width="12" height="110" rx="2" fill="#0284C7" stroke="#0369A1"/>
  <rect x="270" y="150" width="12" height="110" rx="2" fill="#0284C7" stroke="#0369A1"/>
  <rect x="295" y="150" width="12" height="110" rx="2" fill="#0284C7" stroke="#0369A1"/>
  <rect x="320" y="150" width="12" height="110" rx="2" fill="#0284C7" stroke="#0369A1"/>
  <rect x="345" y="150" width="12" height="110" rx="2" fill="#0284C7" stroke="#0369A1"/>
  <rect x="370" y="150" width="12" height="110" rx="2" fill="#0284C7" stroke="#0369A1"/>
  <rect x="395" y="150" width="12" height="110" rx="2" fill="#0284C7" stroke="#0369A1"/>
  <rect x="420" y="150" width="12" height="110" rx="2" fill="#0284C7" stroke="#0369A1"/>
  <rect x="445" y="150" width="12" height="110" rx="2" fill="#0284C7" stroke="#0369A1"/>
  <!-- Top Tie-Down Rail -->
  <rect x="225" y="132" width="260" height="10" rx="3" fill="#64748B"/>
  <circle cx="240" cy="137" r="3" fill="#CBD5E1"/>
  <circle cx="470" cy="137" r="3" fill="#CBD5E1"/>

  <!-- Branding Plate -->
  <rect x="260" y="175" width="190" height="42" rx="4" fill="#0F172A" opacity="0.9"/>
  <text x="355" y="196" fill="#F59E0B" font-family="system-ui, sans-serif" font-weight="800" font-size="14" text-anchor="middle" letter-spacing="1">PIAGGIO APE CARGO</text>
  <text x="355" y="210" fill="#94A3B8" font-family="monospace" font-weight="600" font-size="10" text-anchor="middle">500 KG PAYLOAD • DIESEL HT</text>

  <!-- Front Cab (Ape Three Wheeler Hood & Canopy) -->
  <path d="M 230 145 L 230 270 L 120 270 C 110 270 100 250 95 230 L 85 180 C 80 155 95 130 115 125 L 175 110 C 195 105 220 120 230 145 Z" fill="url(#apeCab)" stroke="#B45309" stroke-width="2"/>
  
  <!-- Front Windshield -->
  <path d="M 120 135 L 175 122 C 185 120 195 125 200 135 L 205 175 L 110 185 C 105 165 110 145 120 135 Z" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <path d="M 125 140 L 170 128 L 195 140 L 125 155 Z" fill="#38BDF8" opacity="0.4"/>
  <!-- Wiper -->
  <line x1="160" y1="180" x2="145" y2="145" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>

  <!-- Driver Door Cutout & Handle -->
  <path d="M 160 185 L 220 180 L 220 260 L 140 260 C 145 240 155 210 160 185 Z" fill="none" stroke="#B45309" stroke-width="2"/>
  <rect x="200" y="215" width="14" height="4" rx="2" fill="#1E293B"/>

  <!-- Headlight & Front Nose -->
  <path d="M 83 195 C 80 215 88 235 95 245 L 98 250" fill="none" stroke="#F59E0B" stroke-width="6" stroke-linecap="round"/>
  <circle cx="85" cy="205" r="14" fill="#FEF08A" stroke="#CA8A04" stroke-width="2"/>
  <circle cx="85" cy="205" r="8" fill="#FFFFFF"/>
  <rect x="80" y="230" width="10" height="14" rx="2" fill="#EA580C"/>

  <!-- Front Mudguard & Single Front Wheel (3-Wheeler) -->
  <path d="M 90 250 C 90 230 130 230 135 260 L 135 285 L 90 285 Z" fill="#1E293B"/>
  <circle cx="112" cy="295" r="32" fill="url(#apeTire)"/>
  <circle cx="112" cy="295" r="18" fill="url(#apeRim)"/>
  <circle cx="112" cy="295" r="6" fill="#475569"/>

  <!-- Rear Wheels (Dual side) -->
  <path d="M 370 260 C 370 235 440 235 440 260 L 440 285 L 370 285 Z" fill="#1E293B"/>
  <circle cx="405" cy="295" r="38" fill="url(#apeTire)"/>
  <circle cx="405" cy="295" r="22" fill="url(#apeRim)"/>
  <circle cx="405" cy="295" r="8" fill="#475569"/>
  <!-- Rear Mudflap -->
  <rect x="440" y="280" width="12" height="30" rx="2" fill="#0F172A"/>

  <!-- Reflector & Rear Taillight -->
  <rect x="475" y="240" width="6" height="20" rx="1" fill="#DC2626"/>
  <rect x="475" y="262" width="6" height="10" rx="1" fill="#F59E0B"/>

  <!-- Official Badge Pill -->
  <g transform="translate(30, 30)">
    <rect width="140" height="28" rx="6" fill="#0F172A" opacity="0.85"/>
    <circle cx="16" cy="14" r="5" fill="#10B981"/>
    <text x="28" y="18" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="11">V01 • 3-WHEELER</text>
  </g>
</svg>
