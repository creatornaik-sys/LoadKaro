<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="dostBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="dostCab" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="dostBed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="dostTire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="dostRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#dostBg)"/>
  <!-- Shadow -->
  <ellipse cx="305" cy="332" rx="260" ry="16" fill="#000000" opacity="0.14"/>
  <ellipse cx="305" cy="330" rx="210" ry="10" fill="#000000" opacity="0.17"/>

  <!-- Chassis & Fuel Tank -->
  <rect x="95" y="274" width="410" height="15" rx="3" fill="#334155"/>
  <rect x="235" y="260" width="75" height="22" rx="4" fill="#1E293B"/>
  <rect x="315" y="262" width="55" height="20" rx="3" fill="#475569"/>

  <!-- High-Capacity 9-ft Cargo Deck -->
  <rect x="230" y="145" width="280" height="125" rx="5" fill="url(#dostBed)" stroke="#075985" stroke-width="2"/>
  <!-- Corrugated Deep Ribs -->
  <rect x="245" y="155" width="16" height="105" rx="2" fill="#0284C7" stroke="#0369A1"/>
  <rect x="275" y="155" width="16" height="105" rx="2" fill="#0284C7" stroke="#0369A1"/>
  <rect x="305" y="155" width="16" height="105" rx="2" fill="#0284C7" stroke="#0369A1"/>
  <rect x="335" y="155" width="16" height="105" rx="2" fill="#0284C7" stroke="#0369A1"/>
  <rect x="365" y="155" width="16" height="105" rx="2" fill="#0284C7" stroke="#0369A1"/>
  <rect x="395" y="155" width="16" height="105" rx="2" fill="#0284C7" stroke="#0369A1"/>
  <rect x="425" y="155" width="16" height="105" rx="2" fill="#0284C7" stroke="#0369A1"/>
  <rect x="455" y="155" width="16" height="105" rx="2" fill="#0284C7" stroke="#0369A1"/>
  <rect x="485" y="155" width="16" height="105" rx="2" fill="#0284C7" stroke="#0369A1"/>

  <!-- Dost+ Signature Plaque -->
  <rect x="270" y="175" width="200" height="44" rx="5" fill="#0F172A" opacity="0.9"/>
  <text x="370" y="196" fill="#38BDF8" font-family="system-ui, sans-serif" font-weight="900" font-size="13" text-anchor="middle" letter-spacing="1">ASHOK LEYLAND DOST+</text>
  <text x="370" y="210" fill="#E2E8F0" font-family="monospace" font-weight="700" font-size="10" text-anchor="middle">1,500 KG PAYLOAD • 1478 CC TDCR</text>

  <!-- Modern Aerodynamic Cab (Japanese-Indian Stance) -->
  <path d="M 230 135 L 230 270 L 95 270 C 85 270 78 260 78 245 L 78 190 C 78 165 90 135 110 120 L 165 98 C 185 90 215 105 230 135 Z" fill="url(#dostCab)" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Swooping Aerodynamic Windshield -->
  <path d="M 108 128 L 165 104 C 178 98 198 105 208 118 L 215 168 L 98 174 C 98 152 102 136 108 128 Z" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <path d="M 115 132 L 165 112 L 202 124 L 115 152 Z" fill="#38BDF8" opacity="0.45"/>
  <!-- Dual Wipers -->
  <line x1="135" y1="170" x2="155" y2="130" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="180" y1="170" x2="200" y2="130" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Dost Blue & Grey Side Graphics Streak -->
  <path d="M 100 215 L 225 210 L 225 224 L 95 228 Z" fill="#0284C7"/>
  <path d="M 105 226 L 225 222 L 225 228 L 102 232 Z" fill="#F59E0B"/>

  <!-- Door Handle & Window Frame -->
  <path d="M 145 174 L 218 170 L 218 262 L 120 262 C 128 230 138 200 145 174 Z" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="195" y="200" width="16" height="5" rx="2" fill="#1E293B"/>

  <!-- Swept-Back Modern Headlamps -->
  <polygon points="76,192 102,188 100,215 76,218" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5"/>
  <circle cx="88" cy="202" r="6" fill="#FFFFFF"/>
  <rect x="76" y="222" width="16" height="8" rx="2" fill="#EA580C"/>

  <!-- Dual-Tone Bumper -->
  <rect x="68" y="245" width="45" height="24" rx="4" fill="#1E293B"/>
  <circle cx="82" cy="256" r="5" fill="#FEF08A"/>

  <!-- Front Wheel (14-inch Commercial) -->
  <path d="M 115 270 C 115 230 180 230 180 270 Z" fill="#1E293B"/>
  <circle cx="148" cy="295" r="40" fill="url(#dostTire)"/>
  <circle cx="148" cy="295" r="23" fill="url(#dostRim)"/>
  <circle cx="148" cy="295" r="8" fill="#1E293B"/>
  <!-- 5-Lug Rims -->
  <circle cx="148" cy="283" r="2.5" fill="#475569"/>
  <circle cx="159" cy="291" r="2.5" fill="#475569"/>
  <circle cx="155" cy="304" r="2.5" fill="#475569"/>
  <circle cx="141" cy="304" r="2.5" fill="#475569"/>
  <circle cx="137" cy="291" r="2.5" fill="#475569"/>

  <!-- Rear Wheel (14-inch Commercial) -->
  <path d="M 390 270 C 390 230 455 230 455 270 Z" fill="#1E293B"/>
  <circle cx="422" cy="295" r="40" fill="url(#dostTire)"/>
  <circle cx="422" cy="295" r="23" fill="url(#dostRim)"/>
  <circle cx="422" cy="295" r="8" fill="#1E293B"/>
  <!-- 5-Lug Rims -->
  <circle cx="422" cy="283" r="2.5" fill="#475569"/>
  <circle cx="433" cy="291" r="2.5" fill="#475569"/>
  <circle cx="429" cy="304" r="2.5" fill="#475569"/>
  <circle cx="415" cy="304" r="2.5" fill="#475569"/>
  <circle cx="411" cy="291" r="2.5" fill="#475569"/>
  <!-- Mudflap -->
  <rect x="455" y="280" width="10" height="30" rx="2" fill="#0F172A"/>

  <!-- Rear Lamps -->
  <rect x="505" y="225" width="8" height="28" rx="2" fill="#DC2626"/>
  <rect x="505" y="255" width="8" height="10" rx="1" fill="#F59E0B"/>

  <!-- Top Badge -->
  <g transform="translate(30, 30)">
    <rect width="140" height="28" rx="6" fill="#0F172A" opacity="0.85"/>
    <circle cx="16" cy="14" r="5" fill="#0284C7"/>
    <text x="28" y="18" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="11">V04 • PICKUP LCV</text>
  </g>
</svg>
