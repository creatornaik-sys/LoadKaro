  <circle cx="448" cy="314" r="3" fill="#334155"/>
  <circle cx="437" cy="309" r="3" fill="#334155"/>
  <circle cx="432" cy="298" r="3" fill="#334155"/>
  <circle cx="437" cy="286" r="3" fill="#334155"/>
