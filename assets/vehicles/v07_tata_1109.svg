  <path d="M 185 115 L 185 270 L 55 270 C 45 270 40 258 40 245 L 40 180 C 40 155 52 130 70 115 L 125 82 C 145 70 175 80 185 105 Z" fill="url(#t1109Cab)" stroke="#065F46" stroke-width="2.5"/>

