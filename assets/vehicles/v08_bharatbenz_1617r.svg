<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="benzBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="benzCab" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="benzCont" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="benzTire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="benzRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#benzBg)"/>
  <!-- Shadow -->
  <ellipse cx="305" cy="342" rx="285" ry="18" fill="#000000" opacity="0.17"/>
  <ellipse cx="305" cy="339" rx="240" ry="12" fill="#000000" opacity="0.21"/>

  <!-- Multi-Axle Heavy HCV Chassis Frame -->
  <rect x="50" y="272" width="505" height="22" rx="3" fill="#020617"/>
  <!-- Fuel Tank with Chrome Straps (350 Litre Long Haul Tank) -->
  <rect x="175" y="254" width="95" height="30" rx="6" fill="#475569" stroke="#0F172A"/>
  <line x1="195" y1="254" x2="195" y2="284" stroke="#E2E8F0" stroke-width="2.5"/>
  <line x1="250" y1="254" x2="250" y2="284" stroke="#E2E8F0" stroke-width="2.5"/>
  <!-- AdBlue / DEF Tank (Blue Cap) & Dual Battery Box -->
  <rect x="275" y="258" width="30" height="24" rx="4" fill="#0284C7"/>
  <circle cx="290" cy="264" r="3" fill="#38BDF8"/>
  <rect x="310" y="258" width="55" height="26" rx="4" fill="#1E293B"/>

  <!-- 22-FT Heavy High-Cube Closed Freight Container Body -->
  <rect x="175" y="80" width="375" height="192" rx="6" fill="url(#benzCont)" stroke="#334155" stroke-width="3"/>
  <!-- Corrugated Panel Vertical Ribs -->
  <line x1="205" y1="85" x2="205" y2="270" stroke="#334155" stroke-width="3"/>
  <line x1="235" y1="85" x2="235" y2="270" stroke="#334155" stroke-width="3"/>
  <line x1="265" y1="85" x2="265" y2="270" stroke="#334155" stroke-width="3"/>
  <line x1="295" y1="85" x2="295" y2="270" stroke="#334155" stroke-width="3"/>
  <line x1="325" y1="85" x2="325" y2="270" stroke="#334155" stroke-width="3"/>
  <line x1="355" y1="85" x2="355" y2="270" stroke="#334155" stroke-width="3"/>
  <line x1="385" y1="85" x2="385" y2="270" stroke="#334155" stroke-width="3"/>
  <line x1="415" y1="85" x2="415" y2="270" stroke="#334155" stroke-width="3"/>
  <line x1="445" y1="85" x2="445" y2="270" stroke="#334155" stroke-width="3"/>
  <line x1="475" y1="85" x2="475" y2="270" stroke="#334155" stroke-width="3"/>
  <line x1="505" y1="85" x2="505" y2="270" stroke="#334155" stroke-width="3"/>
  <line x1="535" y1="85" x2="535" y2="270" stroke="#334155" stroke-width="3"/>

  <!-- High-Visibility Reflective Safety Tape Along Perimeter (RTO Compliant) -->
  <rect x="175" y="262" width="375" height="8" fill="#FACC15"/>
  <line x1="175" y1="266" x2="550" y2="266" stroke="#DC2626" stroke-width="3" stroke-dasharray="14 14"/>

  <!-- Premium Identity Plaque -->
  <rect x="240" y="140" width="250" height="52" rx="6" fill="#020617" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="365" y="163" fill="#F59E0B" font-family="system-ui, sans-serif" font-weight="900" font-size="15" text-anchor="middle" letter-spacing="1">BHARATBENZ 1617R</text>
  <text x="365" y="180" fill="#E2E8F0" font-family="monospace" font-weight="700" font-size="10" text-anchor="middle">22-FT HEAVY HCV • 10,000 KG (10 MT)</text>

  <!-- Modern Daimler-BharatBenz Aerodynamic Heavy Cab -->
  <path d="M 175 110 L 175 272 L 48 272 C 38 272 32 260 32 245 L 32 170 C 32 140 46 108 65 90 L 120 58 C 142 48 170 55 175 78 Z" fill="url(#benzCab)" stroke="#0F172A" stroke-width="2.5"/>
  <!-- Aerodynamic 3D Roof Spoiler / Cab Deflector -->
  <path d="M 120 58 L 175 78 L 175 52 L 132 46 Z" fill="#475569"/>

  <!-- Large Tinted Euro-Style Windshield -->
  <path d="M 62 118 L 122 72 C 138 62 165 68 170 82 L 172 155 L 42 160 C 42 140 50 125 62 118 Z" fill="#020617" stroke="#1E293B" stroke-width="2.5"/>
  <path d="M 70 120 L 125 78 L 165 88 L 52 148 Z" fill="#38BDF8" opacity="0.45"/>
  <!-- Heavy Dual Pantograph Wipers -->
  <line x1="82" y1="158" x2="112" y2="105" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>
  <line x1="130" y1="158" x2="160" y2="105" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>

  <!-- High-Mounted LED Clearance Cab Lights & Sunvisor -->
  <rect x="52" y="102" width="120" height="8" rx="2" fill="#0F172A"/>
  <circle cx="160" cy="106" r="3" fill="#F59E0B"/>
  <circle cx="130" cy="106" r="3" fill="#F59E0B"/>
  <circle cx="70" cy="106" r="3" fill="#F59E0B"/>

  <!-- Heavy Side-Mirror Assembly with Convex Blindspot Spotter -->
  <path d="M 62 125 L 35 120 M 35 110 L 35 145" stroke="#0F172A" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="28" y="112" width="10" height="28" rx="2" fill="#020617"/>

  <!-- Heavy Door Seam & Three-Step Access Ladder -->
  <path d="M 98 160 L 170 155 L 170 262 L 52 262 C 62 215 82 180 98 160 Z" fill="none" stroke="#475569" stroke-width="1.5"/>
  <rect x="145" y="190" width="16" height="5" rx="2" fill="#020617"/>
  <rect x="42" y="260" width="22" height="4" rx="1" fill="#E2E8F0"/>
  <rect x="42" y="250" width="22" height="4" rx="1" fill="#E2E8F0"/>
  <rect x="42" y="240" width="22" height="4" rx="1" fill="#E2E8F0"/>

  <!-- Signature Honeycomb BharatBenz Black Grille & Central Star -->
  <rect x="32" y="172" width="24" height="60" rx="3" fill="#020617"/>
  <circle cx="44" cy="192" r="7" fill="#E2E8F0"/>
  <polygon points="44,186 46,192 44,198 42,192" fill="#020617"/>
  <line x1="34" y1="205" x2="54" y2="205" stroke="#475569" stroke-width="2"/>
  <line x1="34" y1="215" x2="54" y2="215" stroke="#475569" stroke-width="2"/>
  <line x1="34" y1="225" x2="54" y2="225" stroke="#475569" stroke-width="2"/>

  <!-- Sleek Modern Projector Headlamps & Daytime Running Lights (DRL) -->
  <polygon points="32,205 48,202 46,230 32,235" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5"/>
  <circle cx="40" cy="216" r="4" fill="#FFFFFF"/>
  <rect x="32" y="234" width="14" height="6" rx="1" fill="#EA580C"/>

  <!-- Deep Aerodynamic Steel Bumper with Fog Lamps & Tow Eye -->
  <rect x="22" y="246" width="46" height="26" rx="4" fill="#020617"/>
  <circle cx="30" cy="258" r="4" fill="#FEF08A"/>
  <circle cx="56" cy="258" r="4" fill="#94A3B8"/>

  <!-- Front Steer Wheel (295/80R 22.5 Tubeless Radial) -->
  <path d="M 72 272 C 72 218 150 218 150 272 Z" fill="#020617"/>
  <circle cx="112" cy="300" r="48" fill="url(#benzTire)"/>
  <circle cx="112" cy="300" r="28" fill="url(#benzRim)"/>
  <circle cx="112" cy="300" r="11" fill="#0F172A"/>
  <!-- 10 Heavy Hub Bolts -->
  <circle cx="112" cy="282" r="3" fill="#1E293B"/>
  <circle cx="123" cy="285" r="3" fill="#1E293B"/>
  <circle cx="129" cy="294" r="3" fill="#1E293B"/>
  <circle cx="128" cy="305" r="3" fill="#1E293B"/>
  <circle cx="120" cy="314" r="3" fill="#1E293B"/>
  <circle cx="112" cy="318" r="3" fill="#1E293B"/>
  <circle cx="104" cy="314" r="3" fill="#1E293B"/>
  <circle cx="96" cy="305" r="3" fill="#1E293B"/>
  <circle cx="95" cy="294" r="3" fill="#1E293B"/>
  <circle cx="101" cy="285" r="3" fill="#1E293B"/>

  <!-- Rear Dual-Axle Tandem Wheels (Twin Drive Heavy Bogie Axles) -->
  <!-- Axle 1 -->
  <path d="M 370 272 C 370 218 450 218 450 272 Z" fill="#020617"/>
  <circle cx="410" cy="300" r="48" fill="url(#benzTire)"/>
  <circle cx="410" cy="300" r="28" fill="url(#benzRim)"/>
  <circle cx="410" cy="300" r="11" fill="#0F172A"/>
  <!-- Axle 2 (Dual Bogie) -->
  <path d="M 460 272 C 460 218 540 218 540 272 Z" fill="#020617"/>
  <circle cx="500" cy="300" r="48" fill="url(#benzTire)"/>
  <circle cx="500" cy="300" r="28" fill="url(#benzRim)"/>
  <circle cx="500" cy="300" r="11" fill="#0F172A"/>
  <!-- Heavy Continuous Mudguard and Splash Flap -->
  <rect x="535" y="278" width="16" height="40" rx="2" fill="#020617"/>

  <!-- Rear Container Double Lock Bars & Heavy Tail Lights -->
  <line x1="545" y1="85" x2="545" y2="270" stroke="#020617" stroke-width="4"/>
  <rect x="548" y="215" width="8" height="42" rx="2" fill="#DC2626"/>

  <!-- Top Badge -->
  <g transform="translate(30, 30)">
    <rect width="140" height="28" rx="6" fill="#0F172A" opacity="0.85"/>
    <circle cx="16" cy="14" r="5" fill="#F59E0B"/>
    <text x="28" y="18" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="11">V08 • HEAVY HCV</text>
  </g>
</svg>
