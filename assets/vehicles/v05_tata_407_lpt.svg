<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="t407Bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="t407Cab" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FACC15"/>
      <stop offset="100%" stop-color="#EAB308"/>
    </linearGradient>
    <linearGradient id="t407Body" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <linearGradient id="t407Tire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="t407Rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#t407Bg)"/>
  <!-- Shadow -->
  <ellipse cx="305" cy="336" rx="275" ry="17" fill="#000000" opacity="0.16"/>
  <ellipse cx="305" cy="334" rx="225" ry="11" fill="#000000" opacity="0.19"/>

  <!-- Heavy Ladder Chassis Frame -->
  <rect x="70" y="272" width="460" height="18" rx="3" fill="#1E293B"/>
  <!-- Cylindrical Fuel Tank with Steel Straps -->
  <rect x="220" y="258" width="85" height="26" rx="8" fill="#334155" stroke="#1E293B"/>
  <line x1="235" y1="258" x2="235" y2="284" stroke="#F59E0B" stroke-width="2"/>
  <line x1="290" y1="258" x2="290" y2="284" stroke="#F59E0B" stroke-width="2"/>
  <!-- Heavy Duty Battery Box & Air Tank -->
  <rect x="315" y="260" width="50" height="22" rx="3" fill="#475569"/>

  <!-- High-Sided Indian Cargo Body (Legendary Wooden/Steel Body with Yellow Trim) -->
  <rect x="205" y="125" width="315" height="145" rx="4" fill="url(#t407Body)" stroke="#075985" stroke-width="2"/>
  <!-- Traditional Steel Stanchions / Pillars -->
  <rect x="210" y="130" width="10" height="135" fill="#FACC15"/>
  <rect x="260" y="130" width="8" height="135" fill="#FACC15"/>
  <rect x="310" y="130" width="8" height="135" fill="#FACC15"/>
  <rect x="360" y="130" width="8" height="135" fill="#FACC15"/>
  <rect x="410" y="130" width="8" height="135" fill="#FACC15"/>
  <rect x="460" y="130" width="8" height="135" fill="#FACC15"/>
  <rect x="510" y="130" width="8" height="135" fill="#FACC15"/>
  <!-- Horizontal Tie Battens -->
  <line x1="205" y1="165" x2="520" y2="165" stroke="#075985" stroke-width="3"/>
  <line x1="205" y1="205" x2="520" y2="205" stroke="#075985" stroke-width="3"/>
  <!-- Tarpaulin Top Arch Bar -->
  <path d="M 205 125 Q 365 110 520 125" stroke="#F59E0B" stroke-width="4" fill="none"/>

  <!-- Center Identity Plaque -->
  <rect x="245" y="165" width="230" height="46" rx="5" fill="#0F172A" opacity="0.95"/>
  <text x="360" y="186" fill="#FACC15" font-family="system-ui, sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="1">TATA 407 LPT</text>
  <text x="360" y="202" fill="#E2E8F0" font-family="monospace" font-weight="700" font-size="10" text-anchor="middle">2,500 KG PAYLOAD • 4SP CR TURBO</text>

  <!-- Iconic Semi-Forward Control Yellow Cab -->
  <path d="M 205 125 L 205 268 L 75 268 C 65 268 58 258 58 245 L 58 190 C 58 170 68 152 82 142 L 135 105 C 150 95 185 100 205 125 Z" fill="url(#t407Cab)" stroke="#CA8A04" stroke-width="2"/>

  <!-- High-Mounted Windshield with Rubber Gasket -->
  <path d="M 85 142 L 138 108 C 150 100 172 105 182 118 L 190 162 L 78 168 C 76 155 80 146 85 142 Z" fill="#0F172A" stroke="#334155" stroke-width="2.5"/>
  <path d="M 90 145 L 138 114 L 175 122 L 90 155 Z" fill="#38BDF8" opacity="0.45"/>
  <!-- Dual Heavy Wipers -->
  <line x1="110" y1="165" x2="135" y2="125" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
  <line x1="155" y1="165" x2="180" y2="125" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>

  <!-- High Snorkel Air Intake (Classic 407 feature) -->
  <path d="M 195 105 L 195 75 L 180 75" stroke="#1E293B" stroke-width="5" stroke-linecap="round" fill="none"/>
  <!-- Heavy Chrome / Metal Side Mirror -->
  <path d="M 85 150 L 65 145 M 65 135 L 65 165" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>

  <!-- Door Cutout & Footstep -->
  <path d="M 125 168 L 198 164 L 198 258 L 105 258 C 110 220 118 190 125 168 Z" fill="none" stroke="#A16207" stroke-width="1.5"/>
  <rect x="175" y="195" width="16" height="6" rx="2" fill="#1E293B"/>
  <rect x="95" y="260" width="25" height="6" rx="2" fill="#1E293B"/>

  <!-- Iconic Circular Headlights on Front Facia -->
  <rect x="58" y="195" width="22" height="48" rx="4" fill="#1E293B"/>
  <circle cx="68" cy="210" r="10" fill="#FEF08A" stroke="#CA8A04" stroke-width="2"/>
  <circle cx="68" cy="210" r="5" fill="#FFFFFF"/>
  <circle cx="68" cy="232" r="7" fill="#EA580C"/>

  <!-- Heavy Cast-Iron Ribbed Bumper with Central Tow Pin -->
  <rect x="48" y="248" width="40" height="24" rx="4" fill="#0F172A"/>
  <circle cx="56" cy="260" r="5" fill="#94A3B8"/>

  <!-- Heavy 16-Inch Front Wheels -->
  <path d="M 100 268 C 100 220 170 220 170 268 Z" fill="#1E293B"/>
  <circle cx="135" cy="296" r="44" fill="url(#t407Tire)"/>
  <circle cx="135" cy="296" r="25" fill="url(#t407Rim)"/>
  <circle cx="135" cy="296" r="9" fill="#1E293B"/>
  <!-- 6 Heavy Lugs -->
  <circle cx="135" cy="282" r="3" fill="#334155"/>
  <circle cx="147" cy="289" r="3" fill="#334155"/>
  <circle cx="147" cy="303" r="3" fill="#334155"/>
  <circle cx="135" cy="310" r="3" fill="#334155"/>
  <circle cx="123" cy="303" r="3" fill="#334155"/>
  <circle cx="123" cy="289" r="3" fill="#334155"/>

  <!-- Dual Rear Wheels (407 Twin Rear Axle) -->
  <path d="M 390 268 C 390 220 470 220 470 268 Z" fill="#1E293B"/>
  <circle cx="430" cy="296" r="44" fill="url(#t407Tire)"/>
  <circle cx="430" cy="296" r="25" fill="url(#t407Rim)"/>
  <circle cx="430" cy="296" r="9" fill="#1E293B"/>
  <circle cx="430" cy="282" r="3" fill="#334155"/>
  <circle cx="442" cy="289" r="3" fill="#334155"/>
  <circle cx="442" cy="303" r="3" fill="#334155"/>
  <circle cx="430" cy="310" r="3" fill="#334155"/>
  <circle cx="418" cy="303" r="3" fill="#334155"/>
  <circle cx="418" cy="289" r="3" fill="#334155"/>
  <!-- Mudflap with TATA branding -->
  <rect x="468" y="278" width="14" height="34" rx="2" fill="#0F172A"/>

  <!-- Rear Tail Assembly -->
  <rect x="515" y="220" width="8" height="34" rx="2" fill="#DC2626"/>
  <rect x="515" y="258" width="8" height="12" rx="1" fill="#F59E0B"/>

  <!-- Top Badge -->
  <g transform="translate(30, 30)">
    <rect width="140" height="28" rx="6" fill="#0F172A" opacity="0.85"/>
    <circle cx="16" cy="14" r="5" fill="#FACC15"/>
    <text x="28" y="18" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="11">V05 • LIGHT TRUCK</text>
  </g>
</svg>
