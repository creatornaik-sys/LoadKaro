<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="aceBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="aceCab" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="aceBed" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="aceTire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="aceRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#aceBg)"/>
  <!-- Ground shadow -->
  <ellipse cx="300" cy="330" rx="250" ry="16" fill="#000000" opacity="0.14"/>
  <ellipse cx="300" cy="328" rx="200" ry="10" fill="#000000" opacity="0.18"/>

  <!-- Chassis & Fuel Tank -->
  <rect x="110" y="272" width="380" height="15" rx="3" fill="#334155"/>
  <rect x="230" y="260" width="60" height="22" rx="4" fill="#475569" stroke="#1E293B"/>
  <rect x="300" y="262" width="45" height="18" rx="3" fill="#64748B"/>

  <!-- Cargo Tub Bed (Rear 7.2ft Deck) -->
  <rect x="220" y="150" width="280" height="120" rx="5" fill="url(#aceBed)" stroke="#94A3B8" stroke-width="2"/>
  <!-- Corrugated Ribs / Panels -->
  <rect x="235" y="160" width="16" height="98" rx="2" fill="#E2E8F0" stroke="#CBD5E1"/>
  <rect x="265" y="160" width="16" height="98" rx="2" fill="#E2E8F0" stroke="#CBD5E1"/>
  <rect x="295" y="160" width="16" height="98" rx="2" fill="#E2E8F0" stroke="#CBD5E1"/>
  <rect x="325" y="160" width="16" height="98" rx="2" fill="#E2E8F0" stroke="#CBD5E1"/>
  <rect x="355" y="160" width="16" height="98" rx="2" fill="#E2E8F0" stroke="#CBD5E1"/>
  <rect x="385" y="160" width="16" height="98" rx="2" fill="#E2E8F0" stroke="#CBD5E1"/>
  <rect x="415" y="160" width="16" height="98" rx="2" fill="#E2E8F0" stroke="#CBD5E1"/>
  <rect x="445" y="160" width="16" height="98" rx="2" fill="#E2E8F0" stroke="#CBD5E1"/>
  <rect x="475" y="160" width="16" height="98" rx="2" fill="#E2E8F0" stroke="#CBD5E1"/>
  <!-- Headboard Frame Behind Cab -->
  <rect x="215" y="130" width="8" height="140" rx="2" fill="#64748B"/>
  <rect x="215" y="130" width="40" height="6" rx="2" fill="#64748B"/>

  <!-- Tata Ace Gold Center Plaque -->
  <rect x="260" y="180" width="200" height="46" rx="6" fill="#0F172A"/>
  <text x="360" y="202" fill="#F59E0B" font-family="system-ui, sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="1">TATA ACE GOLD</text>
  <text x="360" y="217" fill="#E2E8F0" font-family="monospace" font-weight="700" font-size="10" text-anchor="middle">CHHOTA HATHI • 750 KG</text>

  <!-- Front Cab (Signature Tata Ace Rounded Forward Control) -->
  <path d="M 220 140 L 220 270 L 105 270 C 95 270 85 260 85 245 L 85 200 C 85 175 95 145 115 130 L 165 105 C 185 95 210 110 220 140 Z" fill="url(#aceCab)" stroke="#CBD5E1" stroke-width="2"/>

  <!-- Signature Swept Windshield -->
  <path d="M 115 135 L 165 112 C 178 106 195 112 202 125 L 208 170 L 105 175 C 103 160 108 142 115 135 Z" fill="#0F172A" stroke="#334155" stroke-width="2"/>
  <path d="M 120 140 L 162 120 L 195 130 L 120 155 Z" fill="#38BDF8" opacity="0.45"/>
  <!-- Dual Wipers -->
  <line x1="140" y1="172" x2="160" y2="135" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="180" y1="172" x2="198" y2="135" stroke="#1E293B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Door Outline & Side Window -->
  <path d="M 145 178 L 210 174 L 210 262 L 125 262 C 130 235 140 205 145 178 Z" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="185" y="210" width="16" height="5" rx="2" fill="#1E293B"/>

  <!-- Front Grille & Tata Ace Smoked Horizontal Bar -->
  <rect x="85" y="210" width="30" height="24" rx="3" fill="#1E293B"/>
  <line x1="88" y1="216" x2="112" y2="216" stroke="#F59E0B" stroke-width="2"/>
  <line x1="88" y1="222" x2="112" y2="222" stroke="#94A3B8" stroke-width="1.5"/>
  <line x1="88" y1="228" x2="112" y2="228" stroke="#94A3B8" stroke-width="1.5"/>

  <!-- Signature Crystal Headlamps -->
  <circle cx="92" cy="235" r="12" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5"/>
  <circle cx="92" cy="235" r="7" fill="#FFFFFF"/>
  <rect x="87" y="250" width="10" height="12" rx="2" fill="#EA580C"/>

  <!-- Bumper Bar (Grey Polypropylene) -->
  <rect x="75" y="260" width="45" height="18" rx="4" fill="#334155"/>
  <rect x="70" y="265" width="10" height="8" rx="2" fill="#F8FAFC"/>

  <!-- Front Wheel & Mudguard -->
  <path d="M 120 270 C 120 235 180 235 180 270 Z" fill="#1E293B"/>
  <circle cx="150" cy="295" r="38" fill="url(#aceTire)"/>
  <circle cx="150" cy="295" r="22" fill="url(#aceRim)"/>
  <circle cx="150" cy="295" r="8" fill="#475569"/>
  <!-- 4-Lug Rims -->
  <circle cx="143" cy="290" r="2.5" fill="#1E293B"/>
  <circle cx="157" cy="290" r="2.5" fill="#1E293B"/>
  <circle cx="143" cy="300" r="2.5" fill="#1E293B"/>
  <circle cx="157" cy="300" r="2.5" fill="#1E293B"/>

  <!-- Rear Wheel & Mudguard -->
  <path d="M 390 270 C 390 235 450 235 450 270 Z" fill="#1E293B"/>
  <circle cx="420" cy="295" r="38" fill="url(#aceTire)"/>
  <circle cx="420" cy="295" r="22" fill="url(#aceRim)"/>
  <circle cx="420" cy="295" r="8" fill="#475569"/>
  <!-- 4-Lug Rims -->
  <circle cx="413" cy="290" r="2.5" fill="#1E293B"/>
  <circle cx="427" cy="290" r="2.5" fill="#1E293B"/>
  <circle cx="413" cy="300" r="2.5" fill="#1E293B"/>
  <circle cx="427" cy="300" r="2.5" fill="#1E293B"/>
  <!-- Mudflap -->
  <rect x="452" y="282" width="10" height="26" rx="2" fill="#0F172A"/>

  <!-- Rear Taillights -->
  <rect x="495" y="235" width="8" height="25" rx="2" fill="#DC2626"/>
  <rect x="495" y="262" width="8" height="10" rx="1" fill="#F59E0B"/>

  <!-- Top Badge -->
  <g transform="translate(30, 30)">
    <rect width="140" height="28" rx="6" fill="#0F172A" opacity="0.85"/>
    <circle cx="16" cy="14" r="5" fill="#F59E0B"/>
    <text x="28" y="18" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="11">V02 • MINI TRUCK</text>
  </g>
</svg>
