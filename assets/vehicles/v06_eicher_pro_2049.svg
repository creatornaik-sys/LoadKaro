<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="eicherBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="eicherCab" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F1F5F9"/>
    </linearGradient>
    <linearGradient id="eicherCont" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>
    <linearGradient id="eicherTire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="eicherRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#94A3B8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="380" fill="url(#eicherBg)"/>
  <!-- Shadow -->
  <ellipse cx="305" cy="336" rx="275" ry="17" fill="#000000" opacity="0.15"/>
  <ellipse cx="305" cy="334" rx="225" ry="11" fill="#000000" opacity="0.18"/>

  <!-- Heavy Chassis Rails & Side Under-Run Protection Bar -->
  <rect x="65" y="272" width="470" height="18" rx="3" fill="#1E293B"/>
  <!-- Side Under-Run Protection Bar (Indian RTO safety guard) -->
  <rect x="180" y="260" width="170" height="8" rx="2" fill="#E2E8F0" stroke="#0F172A"/>
  <rect x="180" y="272" width="170" height="8" rx="2" fill="#E2E8F0" stroke="#0F172A"/>
  <line x1="220" y1="260" x2="220" y2="280" stroke="#0F172A" stroke-width="2"/>
  <line x1="300" y1="260" x2="300" y2="280" stroke="#0F172A" stroke-width="2"/>
  <rect x="230" y="248" width="60" height="20" rx="3" fill="#334155"/>

  <!-- 14-FT Enclosed Steel Cargo Container Body (Corrugated High-Volume) -->
  <rect x="180" y="95" width="345" height="175" rx="6" fill="url(#eicherCont)" stroke="#C2410C" stroke-width="2.5"/>
  <!-- Corrugated Container Vertical Steel Ribs -->
  <line x1="210" y1="100" x2="210" y2="265" stroke="#C2410C" stroke-width="3"/>
  <line x1="240" y1="100" x2="240" y2="265" stroke="#C2410C" stroke-width="3"/>
  <line x1="270" y1="100" x2="270" y2="265" stroke="#C2410C" stroke-width="3"/>
  <line x1="300" y1="100" x2="300" y2="265" stroke="#C2410C" stroke-width="3"/>
  <line x1="330" y1="100" x2="330" y2="265" stroke="#C2410C" stroke-width="3"/>
  <line x1="360" y1="100" x2="360" y2="265" stroke="#C2410C" stroke-width="3"/>
  <line x1="390" y1="100" x2="390" y2="265" stroke="#C2410C" stroke-width="3"/>
  <line x1="420" y1="100" x2="420" y2="265" stroke="#C2410C" stroke-width="3"/>
  <line x1="450" y1="100" x2="450" y2="265" stroke="#C2410C" stroke-width="3"/>
  <line x1="480" y1="100" x2="480" y2="265" stroke="#C2410C" stroke-width="3"/>
  <line x1="510" y1="100" x2="510" y2="265" stroke="#C2410C" stroke-width="3"/>

  <!-- Yellow/White Conspicuity Reflective Safety Tape Along Perimeter -->
  <rect x="180" y="258" width="345" height="8" fill="#FACC15"/>
  <line x1="180" y1="262" x2="525" y2="262" stroke="#DC2626" stroke-width="3" stroke-dasharray="12 12"/>

  <!-- Container Center Emblem Plaque -->
  <rect x="235" y="150" width="235" height="50" rx="6" fill="#0F172A" opacity="0.95"/>
  <text x="352" y="172" fill="#F59E0B" font-family="system-ui, sans-serif" font-weight="900" font-size="14" text-anchor="middle" letter-spacing="1">EICHER PRO 2049</text>
  <text x="352" y="189" fill="#E2E8F0" font-family="monospace" font-weight="700" font-size="10" text-anchor="middle">14-FT CONTAINER • 3,500 KG PAYLOAD</text>

  <!-- Modern Eicher Forward-Control Aerodynamic Cab -->
  <path d="M 180 135 L 180 270 L 60 270 C 52 270 46 260 46 248 L 46 175 C 46 148 60 120 78 105 L 125 78 C 145 68 175 75 180 95 Z" fill="url(#eicherCab)" stroke="#CBD5E1" stroke-width="2"/>
  <!-- Aerodynamic Roof Collar Deflector -->
  <path d="M 125 78 L 180 95 L 180 72 L 135 68 Z" fill="#E2E8F0"/>

  <!-- Large Panoramic Windshield -->
  <path d="M 75 125 L 128 85 C 140 76 165 82 172 95 L 175 160 L 58 165 C 58 145 65 132 75 125 Z" fill="#0F172A" stroke="#334155" stroke-width="2.5"/>
  <path d="M 82 128 L 132 92 L 168 102 L 78 152 Z" fill="#38BDF8" opacity="0.45"/>
  <!-- Dual Heavy Wipers -->
  <line x1="95" y1="162" x2="120" y2="115" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>
  <line x1="140" y1="162" x2="165" y2="115" stroke="#1E293B" stroke-width="3" stroke-linecap="round"/>

  <!-- Door Line & Step -->
  <path d="M 110 165 L 176 160 L 176 262 L 68 262 C 78 220 95 185 110 165 Z" fill="none" stroke="#94A3B8" stroke-width="1.5"/>
  <rect x="150" y="195" width="16" height="5" rx="2" fill="#1E293B"/>

  <!-- Eicher Pegasus Wing Front Grille & Silver Bar -->
  <rect x="46" y="180" width="22" height="52" rx="3" fill="#1E293B"/>
  <line x1="48" y1="195" x2="68" y2="195" stroke="#E2E8F0" stroke-width="3"/>
  <circle cx="58" cy="195" r="4" fill="#DC2626"/>

  <!-- Modern Vertical Headlamp Cluster -->
  <rect x="46" y="210" width="16" height="30" rx="3" fill="#FEF08A" stroke="#CA8A04" stroke-width="1.5"/>
  <circle cx="54" cy="220" r="5" fill="#FFFFFF"/>
  <rect x="46" y="235" width="16" height="8" rx="1" fill="#EA580C"/>

  <!-- Sturdy Modular Front Bumper -->
  <rect x="38" y="248" width="38" height="24" rx="4" fill="#1E293B"/>

  <!-- Front Wheel (16-Inch) -->
  <path d="M 85 270 C 85 225 155 225 155 270 Z" fill="#1E293B"/>
  <circle cx="120" cy="296" r="44" fill="url(#eicherTire)"/>
  <circle cx="120" cy="296" r="25" fill="url(#eicherRim)"/>
  <circle cx="120" cy="296" r="9" fill="#1E293B"/>
  <circle cx="120" cy="282" r="3" fill="#475569"/>
  <circle cx="132" cy="289" r="3" fill="#475569"/>
  <circle cx="132" cy="303" r="3" fill="#475569"/>
  <circle cx="120" cy="310" r="3" fill="#475569"/>
  <circle cx="108" cy="303" r="3" fill="#475569"/>
  <circle cx="108" cy="289" r="3" fill="#475569"/>

  <!-- Rear Dual Wheels -->
  <path d="M 400 270 C 400 225 480 225 480 270 Z" fill="#1E293B"/>
  <circle cx="440" cy="296" r="44" fill="url(#eicherTire)"/>
  <circle cx="440" cy="296" r="25" fill="url(#eicherRim)"/>
  <circle cx="440" cy="296" r="9" fill="#1E293B"/>
  <circle cx="440" cy="282" r="3" fill="#475569"/>
  <circle cx="452" cy="289" r="3" fill="#475569"/>
  <circle cx="452" cy="303" r="3" fill="#475569"/>
  <circle cx="440" cy="310" r="3" fill="#475569"/>
  <circle cx="428" cy="303" r="3" fill="#475569"/>
  <circle cx="428" cy="289" r="3" fill="#475569"/>
  <!-- Heavy Mudflap -->
  <rect x="480" y="278" width="14" height="34" rx="2" fill="#0F172A"/>

  <!-- Rear Door Latches & Bar Seals -->
  <line x1="520" y1="100" x2="520" y2="265" stroke="#1E293B" stroke-width="4"/>
  <rect x="522" y="215" width="8" height="38" rx="2" fill="#DC2626"/>

  <!-- Top Badge -->
  <g transform="translate(30, 30)">
    <rect width="140" height="28" rx="6" fill="#0F172A" opacity="0.85"/>
    <circle cx="16" cy="14" r="5" fill="#EA580C"/>
    <text x="28" y="18" fill="#F8FAFC" font-family="system-ui, sans-serif" font-weight="700" font-size="11">V06 • CONTAINER</text>
  </g>
</svg>
